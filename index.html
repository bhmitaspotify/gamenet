<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>گیم‌نت</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b21; --elev:#20242c; --text:#eef1f5; --dim:#9aa3b2;
    --accent:#7c5cff; --accent-2:#22c55e; --danger:#ef4444; --warning:#f59e0b; --border:#2a2f3a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:Tahoma,Vazirmatn,system-ui,sans-serif;direction:rtl;padding-bottom:env(safe-area-inset-bottom);}
  button,input,select{font-family:inherit;}
  #root{min-height:100vh;}

  .topbar{position:fixed;top:0;right:0;left:0;height:56px;background:var(--elev);border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:20;}
  .topbar .title{font-weight:bold;font-size:15px;}
  .topbar .right{display:flex;align-items:center;gap:10px;}
  .chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--dim);}
  .chip b{color:var(--accent-2);}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;color:#fff;}

  main{padding:68px 12px 78px;max-width:520px;margin:0 auto;}

  .bottombar{position:fixed;bottom:0;right:0;left:0;height:60px;background:var(--elev);border-top:1px solid var(--border);
    display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom);}
  .navbtn{flex:1;background:none;border:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;padding:6px 0;}
  .navbtn.active{color:var(--accent);}
  .navbtn .ic{font-size:18px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
  .card h3{margin:0 0 8px;font-size:15px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .col{display:flex;flex-direction:column;gap:8px;}
  .muted{color:var(--dim);font-size:12px;}
  .big{font-size:22px;font-weight:bold;}

  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:bold;cursor:pointer;}
  .btn.secondary{background:var(--elev);color:var(--text);border:1px solid var(--border);}
  .btn.success{background:var(--accent-2);}
  .btn.danger{background:var(--danger);}
  .btn.warning{background:var(--warning);color:#1a1a1a;}
  .btn.small{padding:6px 10px;font-size:12px;border-radius:8px;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.5;}

  input[type=text],input[type=number],input[type=password],input[type=tel],select{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:10px 12px;font-size:14px;
  }
  label{font-size:12px;color:var(--dim);margin-bottom:4px;display:block;}

  .badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:11px;font-weight:bold;}
  .badge.card{background:#1e3a8a33;color:#93c5fd;}
  .badge.cash{background:#14532d33;color:#86efac;}
  .badge.unpaid{background:#7f1d1d33;color:#fca5a5;}
  .badge.settled{background:#14532d33;color:#86efac;}

  .overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet{background:var(--card);border-radius:18px 18px 0 0;padding:16px;width:100%;max-width:520px;max-height:88vh;overflow:auto;}
  .sheet .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .sheet .head h3{margin:0;}
  .closebtn{background:var(--elev);border:1px solid var(--border);color:var(--text);border-radius:50%;width:30px;height:30px;font-size:14px;}

  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .pill{background:var(--elev);border:1px solid var(--border);border-radius:10px;padding:10px 0;text-align:center;font-size:13px;cursor:pointer;}
  .pill.active{background:var(--accent);border-color:var(--accent);font-weight:bold;}

  .listitem{border-bottom:1px solid var(--border);padding:10px 0;}
  .listitem:last-child{border-bottom:none;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{width:100%;max-width:360px;text-align:center;}
  .login-box h1{font-size:22px;margin-bottom:4px;}
  .login-box .sub{color:var(--dim);font-size:13px;margin-bottom:22px;}
  .staffbtn{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;font-size:15px;color:var(--text);display:flex;align-items:center;gap:12px;}

  .toast{position:fixed;bottom:76px;right:50%;transform:translateX(50%);background:var(--elev);border:1px solid var(--border);
    color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;max-width:90vw;}

  .tabs2{display:flex;gap:8px;margin-bottom:12px;}
  .tabs2 .btn{flex:1;}

  table.rep{width:100%;border-collapse:collapse;font-size:13px;}
  table.rep td{padding:6px 4px;border-bottom:1px solid var(--border);}
  table.rep td:first-child{color:var(--dim);}
  table.rep td:last-child{text-align:left;font-weight:bold;}

  .barrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;}
  .barrow .label{width:56px;color:var(--dim);flex-shrink:0;}
  .barrow .bar{background:var(--elev);border-radius:6px;height:16px;flex:1;overflow:hidden;}
  .barrow .bar > div{background:var(--accent);height:100%;}
  .barrow .val{width:80px;text-align:left;flex-shrink:0;}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SUPABASE_URL = 'https://owlajemxuxtmbehljwcd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93bGFqZW14dXh0bWJlaGxqd2NkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTU5NjcsImV4cCI6MjEwNDc5MTk2N30.FgcrxA5hvh5-AqX9s17fyWf_-1MYefswo8Bo1iqbQFI';

async function sb(path, opts){
  opts = opts || {};
  const method = opts.method || 'GET';
  const headers = {
    apikey: SUPABASE_ANON_KEY,
    Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json',
  };
  if (method !== 'GET') headers['Prefer'] = 'return=representation';
  let res;
  try{
    res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
      method, headers, body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  }catch(e){
    throw new Error('اتصال به اینترنت برقرار نیست');
  }
  if (!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error('خطا: ' + res.status + ' ' + t);
  }
  if (res.status === 204) return null;
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
function enc(s){ return encodeURIComponent(s); }
function toman(n){ return Math.round(n||0).toLocaleString('en-US') + ' تومان'; }
function fmtDur(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return (h>0? h+':' : '') + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('fa-IR') + ' ' + d.toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
}

function loadStoredStaff(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem('gn_staff') || 'null'); }catch(e){}
  if (!s || !s.username || !s.display_name){ localStorage.removeItem('gn_staff'); return null; }
  return s;
}
const state = {
  staff: loadStoredStaff(),
  tab: 'dashboard',
  deviceTypes: [],
  devices: [],
  activeSessions: [],
  customers: [],
  history: [],
  loading: false,
  modal: null, // {type, ...}
  toast: null,
  report: { mode: 'week', offset: 0, data: null },
};

function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 2500);
}

async function safe(fn){
  try{ await fn(); }
  catch(e){ showToast(e.message || 'خطا رخ داد'); }
}

async function loadCore(){
  const [types, devices] = await Promise.all([
    sb('device_types?select=*&order=id'),
    sb('devices?select=*&order=id'),
  ]);
  state.deviceTypes = types;
  state.devices = devices;
}
async function loadActiveSessions(){
  state.activeSessions = await sb('sessions?status=eq.active&select=*');
}
async function loadCustomers(search){
  let q = 'customers?select=*&order=created_at.desc&limit=200';
  if (search) q += '&or=(name.ilike.*' + enc(search) + '*,code.ilike.*' + enc(search) + '*,phone.ilike.*' + enc(search) + '*)';
  state.customers = await sb(q);
}
async function loadHistory(){
  state.history = await sb('sessions?status=eq.completed&select=*&order=end_at.desc&limit=200');
}

function deviceType(id){ return state.deviceTypes.find(t => t.id === id); }
function device(id){ return state.devices.find(d => d.id === id); }
function customer(id){ return state.customers.find(c => String(c.id) === String(id)); }
function activeSessionFor(deviceId){ return state.activeSessions.find(s => s.device_id === deviceId); }
function rateFor(typeId, players){
  const t = deviceType(typeId);
  if (!t) return 0;
  return [t.price_1, t.price_2, t.price_3, t.price_4][players-1];
}

// ---------- Auth ----------
async function login(username, password){
  const rows = await sb('staff?username=eq.' + enc(username) + '&password=eq.' + enc(password) + '&select=*');
  if (!rows.length){ showToast('نام کاربری یا رمز اشتباه است'); return; }
  state.staff = rows[0];
  localStorage.setItem('gn_staff', JSON.stringify(rows[0]));
  await bootApp();
}
function logout(){
  state.staff = null;
  localStorage.removeItem('gn_staff');
  render();
}
async function changePassword(newPass){
  await sb('staff?username=eq.' + enc(state.staff.username), { method:'PATCH', body:{ password:newPass } });
  state.staff.password = newPass;
  localStorage.setItem('gn_staff', JSON.stringify(state.staff));
  showToast('رمز عوض شد');
  closeModal();
}

// ---------- Session actions ----------
async function startSession({deviceId, customerId, players}){
  const d = device(deviceId);
  const rate = rateFor(d.type_id, players);
  await sb('sessions', { method:'POST', body:{
    device_id: deviceId, customer_id: customerId, players, hourly_rate: rate,
    start_at: new Date().toISOString(), status:'active', staff_username: state.staff.username,
  }});
  await loadActiveSessions();
  closeModal();
  render();
}
async function addCafeItem(sessionId, name, price){
  const s = state.activeSessions.find(x=>x.id===sessionId);
  const items = (s.cafe_items || []).concat([{name, price}]);
  const cafeCost = items.reduce((a,i)=>a+Number(i.price||0),0);
  await sb('sessions?id=eq.'+sessionId, { method:'PATCH', body:{ cafe_items: items, cafe_cost: cafeCost } });
  await loadActiveSessions();
  render();
}
async function removeCafeItem(sessionId, idx){
  const s = state.activeSessions.find(x=>x.id===sessionId);
  const items = (s.cafe_items||[]).slice();
  items.splice(idx,1);
  const cafeCost = items.reduce((a,i)=>a+Number(i.price||0),0);
  await sb('sessions?id=eq.'+sessionId, { method:'PATCH', body:{ cafe_items: items, cafe_cost: cafeCost } });
  await loadActiveSessions();
  render();
}
function liveCost(s){
  const hours = (Date.now() - new Date(s.start_at).getTime()) / 3600000;
  return hours * s.hourly_rate;
}
async function endSession(sessionId, paymentType){
  const s = state.activeSessions.find(x=>x.id===sessionId);
  const playCost = liveCost(s);
  const cafeCost = s.cafe_cost || 0;
  const total = playCost + cafeCost;
  const paid = paymentType !== 'unpaid';
  await sb('sessions?id=eq.'+sessionId, { method:'PATCH', body:{
    end_at: new Date().toISOString(), status:'completed',
    play_cost: playCost, cafe_cost: cafeCost, total_cost: total,
    payment_type: paymentType, paid,
  }});
  if (!paid){
    const c = customer(s.customer_id) || (await sb('customers?id=eq.'+s.customer_id+'&select=*'))[0];
    await sb('customers?id=eq.'+s.customer_id, { method:'PATCH', body:{ debt: Number(c.debt||0) + total } });
  }
  await Promise.all([loadActiveSessions(), loadCustomers()]);
  closeModal();
  showToast('فاکتور ثبت شد: ' + toman(total));
  render();
}
async function settleDebt(customerId, amount){
  const c = customer(customerId);
  const newDebt = Math.max(0, Number(c.debt||0) - amount);
  await sb('customers?id=eq.'+customerId, { method:'PATCH', body:{ debt:newDebt } });
  await loadCustomers();
  closeModal();
  showToast('تسویه شد');
  render();
}
async function settleHistorySession(sessionId){
  const s = state.history.find(x=>x.id===sessionId);
  await sb('sessions?id=eq.'+sessionId, { method:'PATCH', body:{ paid:true } });
  const c = (await sb('customers?id=eq.'+s.customer_id+'&select=*'))[0];
  await sb('customers?id=eq.'+s.customer_id, { method:'PATCH', body:{ debt: Math.max(0, Number(c.debt||0) - s.total_cost) } });
  await Promise.all([loadHistory(), loadCustomers()]);
  showToast('تسویه شد');
  render();
}
async function createCustomer(name, phone){
  const rows = await sb('customers', { method:'POST', body:{ name, phone: phone||null } });
  await loadCustomers();
  return rows[0];
}
async function saveDeviceType(id, prices){
  await sb('device_types?id=eq.'+id, { method:'PATCH', body:{
    price_1:prices[0], price_2:prices[1], price_3:prices[2], price_4:prices[3]
  }});
  await loadCore();
  showToast('تعرفه ذخیره شد');
  render();
}
async function saveDeviceTypeAssign(deviceId, typeId){
  await sb('devices?id=eq.'+enc(deviceId), { method:'PATCH', body:{ type_id: typeId } });
  await loadCore();
  render();
}

// ---------- Reports ----------
function rangeFor(mode, offset){
  const now = new Date();
  if (mode === 'week'){
    const day = now.getDay(); // 0 Sun..6 Sat ; Iranian week starts Saturday(6)
    const diffToSat = (day + 1) % 7;
    const start = new Date(now); start.setHours(0,0,0,0); start.setDate(start.getDate() - diffToSat + offset*7);
    const end = new Date(start); end.setDate(end.getDate()+7);
    return {start, end};
  } else {
    const start = new Date(now); start.setHours(0,0,0,0); start.setDate(start.getDate() - 30 + offset*30 - (now.getDate()%1));
    const trueStart = new Date(now); trueStart.setHours(0,0,0,0); trueStart.setDate(trueStart.getDate() + offset*30 - 29);
    const end = new Date(trueStart); end.setDate(end.getDate()+30);
    return {start: trueStart, end};
  }
}
async function loadReport(){
  const {start, end} = rangeFor(state.report.mode, state.report.offset);
  const rows = await sb('sessions?status=eq.completed&end_at=gte.'+start.toISOString()+'&end_at=lt.'+end.toISOString()+'&select=*');
  const agg = { count: rows.length, play:0, cafe:0, collected:0, debt:0, byStaff:{}, buckets:{} };
  const bucketMs = state.report.mode==='week' ? 86400000 : 7*86400000;
  const bucketCount = state.report.mode==='week' ? 7 : 5;
  for (let i=0;i<bucketCount;i++) agg.buckets[i]=0;
  rows.forEach(r=>{
    agg.play += Number(r.play_cost||0);
    agg.cafe += Number(r.cafe_cost||0);
    if (r.paid) agg.collected += Number(r.total_cost||0);
    if (r.payment_type==='unpaid') agg.debt += Number(r.total_cost||0);
    const st = agg.byStaff[r.staff_username] || {count:0,total:0};
    st.count++; st.total += Number(r.total_cost||0);
    agg.byStaff[r.staff_username] = st;
    const idx = Math.min(bucketCount-1, Math.floor((new Date(r.end_at)-start)/bucketMs));
    if (idx>=0) agg.buckets[idx] += Number(r.total_cost||0);
  });
  state.report.data = agg;
  state.report.range = {start, end};
  render();
}

// ---------- Modal helpers ----------
function openModal(m){ state.modal = m; render(); }
function closeModal(){ state.modal = null; render(); }

// ---------- Boot ----------
async function bootApp(){
  state.loading = true; render();
  await safe(async ()=>{
    await loadCore();
    await loadActiveSessions();
    await loadCustomers();
  });
  state.loading = false;
  render();
  setInterval(()=>{ if(state.staff) render(); }, 1000);
  setInterval(()=>{ if(state.staff) safe(async()=>{
    await loadActiveSessions();
    if (state.tab==='customers') await loadCustomers();
    if (state.tab==='history') await loadHistory();
  }); }, 6000);
}

// ---------- Render ----------
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

function renderLogin(){
  return `
  <div class="login-wrap"><div class="login-box">
    <h1>🎮 گیم‌نت</h1>
    <div class="sub">برای ادامه وارد شوید</div>
    <button class="staffbtn" onclick="openModal({type:'login', user:'arvin'})">
      <span class="avatar">ا</span> اروین
    </button>
    <button class="staffbtn" onclick="openModal({type:'login', user:'parsa'})">
      <span class="avatar">پ</span> پارسا
    </button>
  </div></div>`;
}

function renderTopbar(){
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const todaySales = state.history
    .filter(h => new Date(h.end_at) >= todayStart)
    .reduce((a,h)=>a+Number(h.total_cost||0),0);
  return `
  <div class="topbar">
    <div class="right">
      <div class="avatar" onclick="openModal({type:'profile'})">${state.staff.display_name[0]}</div>
      <div class="title">${state.staff.display_name}</div>
    </div>
    <div class="chip">امروز: <b>${toman(todaySales)}</b></div>
  </div>`;
}

function renderBottomnav(){
  const tabs = [
    ['dashboard','🏠','داشبورد'],
    ['history','🧾','تاریخچه'],
    ['customers','👥','مشتریان'],
    ['devices','🖥️','دستگاه‌ها'],
    ['reports','📊','گزارش'],
  ];
  return `<div class="bottombar">${tabs.map(([id,ic,label])=>`
    <button class="navbtn ${state.tab===id?'active':''}" onclick="setTab('${id}')">
      <span class="ic">${ic}</span><span>${label}</span>
    </button>`).join('')}</div>`;
}

function setTab(t){
  state.tab = t;
  if (t==='history') safe(loadHistory);
  if (t==='customers') safe(()=>loadCustomers());
  if (t==='reports') safe(loadReport);
  render();
}

function renderDashboard(){
  const cards = state.devices.map(d=>{
    const t = deviceType(d.type_id);
    const s = activeSessionFor(d.id);
    if (!s){
      return `<div class="card">
        <div class="row"><h3>${d.name}</h3><span class="muted">${t?t.label:''}</span></div>
        <button class="btn success block" onclick="openModal({type:'start', deviceId:'${d.id}'})">شروع بازی</button>
      </div>`;
    }
    const c = customer(s.customer_id);
    const elapsed = Date.now() - new Date(s.start_at).getTime();
    const cost = liveCost(s) + Number(s.cafe_cost||0);
    return `<div class="card">
      <div class="row"><h3>${d.name}</h3><span class="muted">${t?t.label:''} · ${s.players} نفره</span></div>
      <div class="muted">مشتری: ${c? c.name+' ('+c.code+')' : '...'}</div>
      <div class="row" style="margin-top:8px;">
        <span class="big">${fmtDur(elapsed)}</span>
        <span class="big">${toman(cost)}</span>
      </div>
      <div class="row" style="margin-top:10px;gap:8px;">
        <button class="btn secondary small" style="flex:1" onclick="openModal({type:'cafe', sessionId:${s.id}})">➕ سفارش کافه</button>
        <button class="btn danger small" style="flex:1" onclick="openModal({type:'end', sessionId:${s.id}})">پایان بازی</button>
      </div>
    </div>`;
  }).join('');
  return `<div>${cards}</div>`;
}

function renderCustomers(){
  const rows = state.customers.map(c=>`
    <div class="listitem">
      <div class="row">
        <div><b>${c.name}</b> <span class="muted">${c.code}</span>${c.phone?`<div class="muted">${c.phone}</div>`:''}</div>
        <div>
          ${Number(c.debt)>0
            ? `<button class="btn warning small" onclick="openModal({type:'settle', customerId:${c.id}})">بدهی: ${toman(c.debt)}</button>`
            : `<span class="muted">بدهی ندارد</span>`}
        </div>
      </div>
    </div>`).join('') || `<div class="muted">مشتری‌ای یافت نشد</div>`;
  return `
  <div class="card">
    <input type="text" placeholder="جستجوی نام، کد یا شماره..." id="custSearch" oninput="onCustSearch(this.value)">
  </div>
  <button class="btn block" style="margin-bottom:12px" onclick="openModal({type:'newCustomer'})">+ مشتری جدید</button>
  <div class="card">${rows}</div>`;
}
let custSearchTimer;
function onCustSearch(v){
  clearTimeout(custSearchTimer);
  custSearchTimer = setTimeout(()=> safe(()=>loadCustomers(v)), 300);
}

function renderDevices(){
  const typeCards = state.deviceTypes.map(t=>`
    <div class="card">
      <h3>${t.label}</h3>
      <div class="grid4">
        ${[1,2,3,4].map(p=>`
          <div>
            <label>${p} نفره</label>
            <input type="number" id="rate_${t.id}_${p}" value="${t['price_'+p]}">
          </div>`).join('')}
      </div>
      <button class="btn block" style="margin-top:10px" onclick="saveTypeRates('${t.id}')">ذخیره تعرفه</button>
    </div>`).join('');
  const deviceRows = state.devices.map(d=>`
    <div class="listitem row">
      <span>${d.name}</span>
      <select onchange="saveDeviceTypeAssign('${d.id}', this.value)">
        ${state.deviceTypes.map(t=>`<option value="${t.id}" ${t.id===d.type_id?'selected':''}>${t.label}</option>`).join('')}
      </select>
    </div>`).join('');
  return `${typeCards}<div class="card"><h3>دستگاه‌ها</h3>${deviceRows}</div>`;
}
function saveTypeRates(typeId){
  const prices = [1,2,3,4].map(p => Number(document.getElementById(`rate_${typeId}_${p}`).value || 0));
  safe(()=>saveDeviceType(typeId, prices));
}

function renderHistory(){
  const rows = state.history.map(s=>{
    const d = device(s.device_id);
    const c = customer(s.customer_id);
    const badgeClass = s.payment_type==='card'?'card':(s.payment_type==='cash'?'cash':(s.paid?'settled':'unpaid'));
    const badgeText = s.payment_type==='card'?'کارتخوان':(s.payment_type==='cash'?'نقدی':(s.paid?'تسویه‌شده':'پرداخت‌نشده'));
    return `<div class="listitem">
      <div class="row">
        <b>${d?d.name:s.device_id}</b>
        <span class="muted">${fmtDate(s.end_at)}</span>
      </div>
      <div class="muted">${c? c.name+' ('+c.code+')':''} · ${s.players} نفره · ${fmtDur(new Date(s.end_at)-new Date(s.start_at))}</div>
      <div class="row" style="margin-top:6px">
        <span class="badge ${badgeClass}">${badgeText}</span>
        <b>${toman(s.total_cost)}</b>
      </div>
      ${(!s.paid) ? `<button class="btn warning small block" style="margin-top:8px" onclick="safe(()=>settleHistorySession(${s.id}))">علامت‌گذاری به‌عنوان تسویه‌شده</button>` : ''}
    </div>`;
  }).join('') || `<div class="muted">فاکتوری ثبت نشده</div>`;
  return `<div class="card">${rows}</div>`;
}

function renderReports(){
  const r = state.report;
  if (!r.data) return `<div class="muted">در حال بارگذاری...</div>`;
  const d = r.data;
  const rangeLabel = r.range ? (r.range.start.toLocaleDateString('fa-IR') + ' تا ' + new Date(r.range.end-1).toLocaleDateString('fa-IR')) : '';
  const maxBucket = Math.max(1, ...Object.values(d.buckets));
  const bucketLabels = r.mode==='week' ? ['شنبه','یک','دو','سه','چهار','پنج','جمعه'] : Object.keys(d.buckets).map((_,i)=>'هفته '+(i+1));
  const bars = Object.entries(d.buckets).map(([k,v])=>`
    <div class="barrow">
      <div class="label">${bucketLabels[k]}</div>
      <div class="bar"><div style="width:${(v/maxBucket*100).toFixed(0)}%"></div></div>
      <div class="val">${toman(v)}</div>
    </div>`).join('');
  const staffRows = Object.entries(d.byStaff).map(([u,v])=>{
    const st = u==='arvin'?'اروین':(u==='parsa'?'پارسا':u);
    return `<tr><td>${st}</td><td>${v.count} فاکتور — ${toman(v.total)}</td></tr>`;
  }).join('');
  return `
  <div class="tabs2">
    <button class="btn ${r.mode==='week'?'':'secondary'}" onclick="setReportMode('week')">هفتگی</button>
    <button class="btn ${r.mode==='month'?'':'secondary'}" onclick="setReportMode('month')">ماهانه (۳۰ روزه)</button>
  </div>
  <div class="row" style="margin-bottom:10px">
    <button class="btn secondary small" onclick="shiftReport(-1)">◀ بازه قبل</button>
    <span class="muted">${rangeLabel}</span>
    <button class="btn secondary small" onclick="shiftReport(1)">بازه بعد ▶</button>
  </div>
  <div class="card">
    <table class="rep">
      <tr><td>تعداد فاکتور</td><td>${d.count}</td></tr>
      <tr><td>درآمد بازی</td><td>${toman(d.play)}</td></tr>
      <tr><td>درآمد کافه</td><td>${toman(d.cafe)}</td></tr>
      <tr><td>جمع دریافتی</td><td>${toman(d.collected)}</td></tr>
      <tr><td>بدهی این بازه</td><td>${toman(d.debt)}</td></tr>
    </table>
  </div>
  <div class="card"><h3>روند</h3>${bars}</div>
  <div class="card"><h3>عملکرد کارمندان</h3><table class="rep">${staffRows || '<tr><td colspan=2 class="muted">داده‌ای نیست</td></tr>'}</table></div>
  `;
}
function setReportMode(m){ state.report.mode=m; state.report.offset=0; safe(loadReport); }
function shiftReport(delta){ state.report.offset += delta; safe(loadReport); }

// ---------- Modals ----------
function renderModal(){
  const m = state.modal;
  if (!m) return '';
  let body = '';
  if (m.type==='login'){
    const label = m.user==='arvin' ? 'اروین' : 'پارسا';
    body = `
      <div class="head"><h3>ورود ${label}</h3><button class="closebtn" onclick="closeModal()">✕</button></div>
      <label>رمز عبور</label>
      <input type="password" id="loginPass" inputmode="numeric">
      <button class="btn block" style="margin-top:12px" onclick="safe(()=>login('${m.user}', document.getElementById('loginPass').value))">ورود</button>`;
  }
  else if (m.type==='profile'){
    body = `
      <div class="head"><h3>${state.staff.display_name}</h3><button class="closebtn" onclick="closeModal()">✕</button></div>
      <label>رمز جدید</label>
      <input type="password" id="newPass" inputmode="numeric">
      <button class="btn block" style="margin-top:10px" onclick="safe(()=>changePassword(document.getElementById('newPass').value))">تغییر رمز</button>
      <button class="btn danger block" style="margin-top:10px" onclick="logout(); closeModal();">خروج از حساب</button>`;
  }
  else if (m.type==='start'){
    const players = m.players || 1;
    const filtered = state.customers;
    body = `
      <div class="head"><h3>شروع بازی — ${m.deviceId}</h3><button class="closebtn" onclick="closeModal()">✕</button></div>
      <label>تعداد نفرات</label>
      <div class="grid4">
        ${[1,2,3,4].map(p=>`<div class="pill ${p===players?'active':''}" onclick="state.modal.players=${p}; render()">${p} نفره</div>`).join('')}
      </div>
      <label style="margin-top:12px">مشتری</label>
      <input type="text" placeholder="جستجو یا نام جدید..." id="startCustSearch" value="${m.custQuery||''}" oninput="state.modal.custQuery=this.value; render()">
      <div style="max-height:160px;overflow:auto;margin-top:6px">
        ${filtered.filter(c=> !m.custQuery || c.name.includes(m.custQuery) || (c.code||'').includes(m.custQuery)).slice(0,20).map(c=>`
          <div class="listitem row" style="cursor:pointer" onclick="state.modal.customerId=${c.id}; render()">
            <span>${c.name} <span class="muted">${c.code}</span></span>
            ${m.customerId===c.id?'✅':''}
          </div>`).join('')}
      </div>
      ${m.custQuery && !filtered.some(c=>c.name===m.custQuery) ? `
        <button class="btn secondary block" style="margin-top:8px" onclick="safe(async()=>{ const c=await createCustomer(state.modal.custQuery, ''); state.modal.customerId=c.id; state.modal.custQuery=c.name; render(); })">
          + ثبت «${m.custQuery}» به‌عنوان مشتری جدید
        </button>` : ''}
      <button class="btn success block" style="margin-top:14px" ${m.customerId?'':'disabled'}
        onclick="safe(()=>startSession({deviceId:'${m.deviceId}', customerId: state.modal.customerId, players: state.modal.players||1}))">
        شروع بازی
      </button>`;
  }
  else if (m.type==='cafe'){
    const s = state.activeSessions.find(x=>x.id===m.sessionId);
    const items = s ? (s.cafe_items||[]) : [];
    body = `
      <div class="head"><h3>سفارش کافه</h3><button class="closebtn" onclick="closeModal()">✕</button></div>
      ${items.map((it,idx)=>`
        <div class="listitem row"><span>${it.name}</span>
          <span>${toman(it.price)} <button class="btn danger small" onclick="safe(()=>removeCafeItem(${m.sessionId}, ${idx}))">حذف</button></span>
        </div>`).join('') || '<div class="muted">آیتمی ثبت نشده</div>'}
      <label style="margin-top:12px">نام آیتم</label>
      <input type="text" id="cafeName">
      <label style="margin-top:8px">قیمت (تومان)</label>
      <input type="number" id="cafePrice">
      <button class="btn block" style="margin-top:12px" onclick="safe(()=>{
        const n=document.getElementById('cafeName').value.trim();
        const p=Number(document.getElementById('cafePrice').value||0);
        if(!n||!p){ showToast('نام و قیمت را وارد کنید'); return; }
        return addCafeItem(${m.sessionId}, n, p);
      })">افزودن</button>`;
  }
  else if (m.type==='end'){
    const s = state.activeSessions.find(x=>x.id===m.sessionId);
    const playCost = s ? liveCost(s) : 0;
    const cafeCost = s ? (s.cafe_cost||0) : 0;
    const total = playCost + cafeCost;
    body = `
      <div class="head"><h3>پایان بازی</h3><button class="closebtn" onclick="closeModal()">✕</button></div>
      <table class="rep">
        <tr><td>مدت بازی</td><td>${fmtDur(Date.now()-new Date(s.start_at).getTime())}</td></tr>
        <tr><td>هزینه بازی</td><td>${toman(playCost)}</td></tr>
        <tr><td>سفارش کافه</td><td>${toman(cafeCost)}</td></tr>
        <tr><td><b>جمع کل</b></td><td><b>${toman(total)}</b></td></tr>
      </table>
      <label style="margin-top:12px">نوع پرداخت</label>
      <div class="col">
        <button class="btn block" onclick="safe(()=>endSession(${m.sessionId}, 'card'))">💳 کارتخوان</button>
        <button class="btn success block" onclick="safe(()=>endSession(${m.sessionId}, 'cash'))">💵 نقدی</button>
        <button class="btn danger block" onclick="safe(()=>endSession(${m.sessionId}, 'unpaid'))">⏳ پرداخت‌نشده (بدهی)</button>
      </div>`;
  }
  else if (m.type==='settle'){
    const c = customer(m.customerId);
    body = `
      <div class="head"><h3>تسویه بدهی — ${c.name}</h3><button class="closebtn" onclick="closeModal()">✕</button></div>
      <div class="muted">بدهی فعلی: ${toman(c.debt)}</div>
      <label style="margin-top:10px">مبلغ پرداختی</label>
      <input type="number" id="settleAmt" value="${c.debt}">
      <button class="btn success block" style="margin-top:12px" onclick="safe(()=>settleDebt(${c.id}, Number(document.getElementById('settleAmt').value||0)))">ثبت تسویه</button>`;
  }
  else if (m.type==='newCustomer'){
    body = `
      <div class="head"><h3>مشتری جدید</h3><button class="closebtn" onclick="closeModal()">✕</button></div>
      <label>نام</label><input type="text" id="newCustName">
      <label style="margin-top:8px">شماره تماس (اختیاری)</label><input type="tel" id="newCustPhone">
      <button class="btn block" style="margin-top:12px" onclick="safe(async()=>{
        const n=document.getElementById('newCustName').value.trim();
        if(!n){ showToast('نام را وارد کنید'); return; }
        await createCustomer(n, document.getElementById('newCustPhone').value.trim());
        closeModal();
      })">ثبت مشتری</button>`;
  }
  return `<div class="overlay" onclick="if(event.target===this) closeModal()"><div class="sheet">${body}</div></div>`;
}

function render(){
  const root = document.getElementById('root');
  if (!state.staff){
    root.innerHTML = renderLogin() + renderModal();
    return;
  }
  let content = '';
  if (state.loading) content = '<div class="muted" style="padding:20px;text-align:center">در حال بارگذاری...</div>';
  else if (state.tab==='dashboard') content = renderDashboard();
  else if (state.tab==='customers') content = renderCustomers();
  else if (state.tab==='devices') content = renderDevices();
  else if (state.tab==='history') content = renderHistory();
  else if (state.tab==='reports') content = renderReports();

  root.innerHTML = `
    ${renderTopbar()}
    <main>${content}</main>
    ${renderBottomnav()}
    ${renderModal()}
    ${state.toast ? `<div class="toast">${state.toast}</div>` : ''}
  `;
}

render();
if (state.staff) bootApp();
</script>
</body>
</html>
